name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_JWT_ISSUER_DOMAIN: https://clerk.example
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_STARTER_PRICE_ID: price_starter_ci
      STRIPE_PRO_PRICE_ID: price_pro_ci
      STRIPE_TEAM_PRICE_ID: price_team_ci
      BILLING_SYNC_SECRET: billing_sync_ci_placeholder
      CONVEX_SERVER_MUTATION_SECRET: convex_server_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
